[package]
name = "sd-turbo"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1"
half = "2"
http-body = "1"
png = "0.17"
regex = "1"
serde_json = "1"
urlencoding = "2"
# wasip3 exports the wasi:http/handler@0.3.0 service. wit-bindgen must match the version wasip3 uses, so that
# both share one async runtime.
wasip3 = { version = "0.9.0", features = ["http-compat"] }
wit-bindgen = { version = "0.62.0", default-features = false, features = ["macros", "async", "async-spawn"] }
